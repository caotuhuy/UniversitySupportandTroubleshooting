<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo — EAUT SUPPORT</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .filter-chips { display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-5); }
        .filter-chip {
            display:inline-flex;align-items:center;gap:6px;padding:6px 14px;
            border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:600;
            border:1.5px solid var(--border-color);background:var(--bg-surface);color:var(--text-secondary);
            cursor:pointer;transition:all var(--transition-fast);
        }
        .filter-chip:hover { border-color:var(--brand-primary);color:var(--brand-primary);background:var(--brand-primary-light); }
        .filter-chip.active { background:var(--brand-primary);color:#fff;border-color:var(--brand-primary); }
        .filter-chip-count {
            min-width:20px;height:20px;border-radius:10px;font-size:.65rem;font-weight:700;
            display:flex;align-items:center;justify-content:center;padding:0 5px;
            background:rgba(255,255,255,.25);
        }
        .filter-chip:not(.active) .filter-chip-count { background:var(--bg-muted);color:var(--text-muted); }

        /* Notification Item */
        .notif-item {
            display:flex;gap:var(--space-4);padding:var(--space-4) var(--space-5);
            border-bottom:1px solid var(--border-color);
            transition:background var(--transition-fast);cursor:pointer;
            text-decoration:none;color:inherit;
        }
        .notif-item:hover { background:var(--bg-surface-hover); }
        .notif-item:last-child { border-bottom:none; }
        .notif-item.unread { background:linear-gradient(90deg,rgba(30,95,168,.04) 0%,transparent 100%); }
        .notif-icon {
            width:40px;height:40px;border-radius:50%;
            display:flex;align-items:center;justify-content:center;
            background:var(--brand-primary-light);color:var(--brand-primary);
            flex-shrink:0;
        }
        .notif-icon svg { width:18px;height:18px; }
        .notif-content { flex:1;min-width:0; }
        .notif-title { font-size:var(--text-md);font-weight:600;color:var(--text-primary);margin-bottom:4px; }
        .notif-item.unread .notif-title { font-weight:700; }
        .notif-body { font-size:var(--text-sm);color:var(--text-secondary);line-height:1.5;margin-bottom:6px; }
        .notif-meta { display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-xs);color:var(--text-muted); }
        .notif-unread-dot { width:8px;height:8px;border-radius:50%;background:var(--brand-primary);flex-shrink:0;margin-top:6px; }
    </style>
</head>
<body class="app-body">
<div class="app-body">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-content">
        <div th:replace="~{fragments/layout :: topbar('Thông báo', true)}"></div>
        <main class="app-main">

            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-group">
                    <div class="section-eyebrow">TRUNG TÂM THÔNG BÁO</div>
                    <h1 class="page-title">Thông báo của bạn</h1>
                    <p class="page-subtitle">Cập nhật về tiến trình xử lý yêu cầu, phân công nhiệm vụ và phản hồi từ hệ thống.</p>
                </div>
                <div class="page-actions">
                    <button type="button" class="btn btn-secondary btn-sm" id="btnMarkAllRead">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        Đánh dấu tất cả đã đọc
                    </button>
                    <button type="button" class="btn btn-secondary" id="btnRefreshNotifs">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                        </svg>
                        Làm mới
                    </button>
                </div>
            </div>

            <!-- Alert -->
            <div id="notifAlert" class="alert" role="alert" hidden style="margin-bottom:var(--space-4)"></div>

            <!-- Filters -->
            <div class="filter-chips">
                <button type="button" class="filter-chip active" data-filter="ALL">
                    Tất cả <span class="filter-chip-count" id="countAllNotifs">0</span>
                </button>
                <button type="button" class="filter-chip" data-filter="UNREAD">
                    Chưa đọc <span class="filter-chip-count" id="countUnreadNotifs">0</span>
                </button>
                <button type="button" class="filter-chip" data-filter="READ">
                    Đã đọc <span class="filter-chip-count" id="countReadNotifs">0</span>
                </button>
            </div>

            <!-- Loading -->
            <div id="notifLoading" class="card" style="padding:var(--space-12);text-align:center">
                <div class="spinner spinner-lg" style="margin:0 auto var(--space-4)"></div>
                <p style="color:var(--text-muted);font-size:var(--text-md)">Đang tải thông báo...</p>
            </div>

            <!-- Empty -->
            <div id="notifEmpty" class="empty-state card" hidden>
                <div class="empty-state-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </div>
                <div class="empty-state-title">Không có thông báo</div>
                <div class="empty-state-desc">Bạn chưa có thông báo nào trong danh mục này.</div>
            </div>

            <!-- Notifications List -->
            <div id="notifList" class="card" hidden>
                <!-- Rendered dynamically by notifications.js -->
            </div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div th:replace="~{fragments/layout :: toasts}"></div>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<div th:replace="~{fragments/layout :: page-scripts}"></div>
</body>
</html>
