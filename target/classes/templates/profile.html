<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân — EAUT SUPPORT</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .profile-layout { display:grid;grid-template-columns:260px 1fr;gap:var(--space-6);align-items:start; }
        @media(max-width:900px) { .profile-layout { grid-template-columns:1fr; } }

        /* Sidebar Card */
        .profile-side-card { position:sticky;top:calc(var(--topbar-height) + var(--space-5)); }
        .profile-avatar-block {
            display:flex;flex-direction:column;align-items:center;
            padding:var(--space-8) var(--space-5);border-bottom:1px solid var(--border-color);text-align:center;
        }
        .avatar-xl {
            width:80px;height:80px;border-radius:50%;
            background:linear-gradient(135deg,var(--brand-primary),var(--brand-secondary));
            display:flex;align-items:center;justify-content:center;
            color:#fff;font-size:1.8rem;font-weight:700;
            margin-bottom:var(--space-4);
            box-shadow:0 6px 20px rgba(30,95,168,.3);
        }
        .profile-name { font-size:var(--text-xl);font-weight:700;color:var(--text-primary);margin-bottom:var(--space-2); }
        .profile-side-nav { padding:var(--space-2) 0; }
        .profile-nav-item {
            display:flex;align-items:center;gap:var(--space-3);
            padding:var(--space-3) var(--space-4);font-size:var(--text-md);font-weight:500;
            color:var(--text-secondary);cursor:pointer;border-radius:var(--radius-xs);
            transition:all var(--transition-fast);border:none;background:none;width:100%;text-align:left;
        }
        .profile-nav-item:hover { background:var(--bg-subtle);color:var(--text-primary); }
        .profile-nav-item.active { background:var(--brand-primary-light);color:var(--brand-primary);font-weight:600; }
        .profile-nav-item svg { width:16px;height:16px;flex-shrink:0; }

        /* Tabs content */
        .tab-pane { display:none; }
        .tab-pane.active { display:block; }

        /* Form Grid */
        .profile-form-grid { display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5); }
        @media(max-width:600px) { .profile-form-grid { grid-template-columns:1fr; } }

        /* Status Badge */
        .account-status-active { color:#065f46;background:#ecfdf5;border-color:#a7f3d0; }
        .account-status-inactive { color:#9f1239;background:#fff1f2;border-color:#fca5a5; }
    </style>
</head>
<body class="app-body">
<div class="app-body">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="app-content">
        <div th:replace="~{fragments/layout :: topbar('Hồ sơ cá nhân', true)}"></div>
        <main class="app-main">

            <!-- Page Header -->
            <div class="page-header">
                <div class="page-title-group">
                    <div class="section-eyebrow">TÀI KHOẢN / CÀI ĐẶT</div>
                    <h1 class="page-title">Hồ sơ cá nhân</h1>
                    <p class="page-subtitle">Quản lý thông tin tài khoản và cài đặt bảo mật của bạn.</p>
                </div>
            </div>

            <!-- Alert -->
            <div id="profileAlert" class="alert" role="alert" hidden style="margin-bottom:var(--space-5)"></div>

            <div class="profile-layout">

                <!-- LEFT: Profile Sidebar -->
                <div>
                    <div class="card profile-side-card">
                        <div class="profile-avatar-block">
                            <div class="avatar-xl" id="profileAvatar">U</div>
                            <div class="profile-name" id="profileDisplayFullName">Đang tải...</div>
                            <span class="badge badge-blue" id="profileDisplayRole" style="margin-top:4px">—</span>
                        </div>
                        <nav class="profile-side-nav" aria-label="Điều hướng hồ sơ">
                            <button type="button" class="profile-nav-item active" data-tab="infoTab">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                                </svg>
                                Thông tin cá nhân
                            </button>
                            <button type="button" class="profile-nav-item" id="pwdTabBtn" data-tab="passwordTab">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                                Đổi mật khẩu
                            </button>
                        </nav>
                        <div style="padding:var(--space-3) var(--space-4) var(--space-4);border-top:1px solid var(--border-color);font-size:var(--text-xs);color:var(--text-muted);line-height:1.6">
                            <strong>Trạng thái tài khoản:</strong><br>
                            <span class="badge" id="profileStatusBadge" style="margin-top:4px">—</span>
                        </div>
                    </div>
                </div>

                <!-- RIGHT: Content -->
                <div>

                    <!-- Tab: Thông tin cá nhân -->
                    <div id="infoTab" class="tab-pane active">
                        <div class="card">
                            <div class="card-header">
                                <h2 class="card-title">Thông tin cá nhân</h2>
                                <span class="badge badge-gray" style="font-size:var(--text-xs)">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                         style="vertical-align:middle;margin-right:3px">
                                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
                                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                                    </svg>
                                    Thông tin bổ sung có thể chỉnh sửa
                                </span>
                            </div>
                            <div class="card-body">
                                <form id="profileForm">
                                    <div class="profile-form-grid">
                                        <div class="form-group">
                                            <label class="form-label">Tên đăng nhập</label>
                                            <input type="text" id="profileUsername" class="form-control" disabled readonly>
                                        </div>
                                        <div class="form-group">
                                            <label class="form-label">Mã định danh</label>
                                            <input type="text" id="profileCode" class="form-control" disabled readonly>
                                        </div>
                                        <div class="form-group">
                                            <label class="form-label" for="profileFullName">
                                                Họ và tên <span class="required">*</span>
                                            </label>
                                            <input type="text" id="profileFullName" class="form-control" required>
                                        </div>
                                        <div class="form-group">
                                            <label class="form-label" for="profileEmail">
                                                Email <span class="required">*</span>
                                            </label>
                                            <input type="email" id="profileEmail" class="form-control" required>
                                        </div>
                                        <div class="form-group">
                                            <label class="form-label" for="profilePhone">Số điện thoại</label>
                                            <input type="text" id="profilePhone" class="form-control" placeholder="09xxxxxxxx">
                                        </div>
                                        <div class="form-group">
                                            <label class="form-label">Vai trò</label>
                                            <input type="text" id="profileRoleDisplay" class="form-control" disabled readonly>
                                        </div>
                                    </div>
                                    <div style="margin-top:var(--space-5);display:flex;justify-content:flex-end;gap:var(--space-3)">
                                        <button type="button" class="btn btn-secondary" onclick="loadProfile()">Đặt lại</button>
                                        <button type="submit" class="btn btn-primary" id="btnSaveProfile">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                                                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <polyline points="20 6 9 17 4 12"/>
                                            </svg>
                                            Lưu thay đổi
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Tab: Đổi mật khẩu -->
                    <div id="passwordTab" class="tab-pane" style="anchor-name:--password">
                        <div class="card">
                            <div class="card-header">
                                <h2 class="card-title">Thiết lập mật khẩu mới</h2>
                            </div>
                            <div class="card-body">
                                <div class="alert alert-info" style="margin-bottom:var(--space-5)">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
                                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                                    </svg>
                                    <div class="alert-content">
                                        Mật khẩu mới cần có tối thiểu <strong>6 ký tự</strong> để bảo vệ tài khoản của bạn.
                                    </div>
                                </div>
                                <form id="changePasswordForm" style="max-width:460px">
                                    <div class="form-group">
                                        <label class="form-label" for="currentPassword">
                                            Mật khẩu hiện tại <span class="required">*</span>
                                        </label>
                                        <input type="password" id="currentPassword" class="form-control" required autocomplete="current-password">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="newPassword">
                                            Mật khẩu mới <span class="required">*</span>
                                        </label>
                                        <input type="password" id="newPassword" class="form-control" minlength="6" required autocomplete="new-password">
                                        <div class="form-hint">Tối thiểu 6 ký tự.</div>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="confirmPassword">
                                            Xác nhận mật khẩu mới <span class="required">*</span>
                                        </label>
                                        <input type="password" id="confirmPassword" class="form-control" minlength="6" required autocomplete="new-password">
                                    </div>
                                    <div style="margin-top:var(--space-5)">
                                        <button type="submit" class="btn btn-primary" id="btnChangePassword">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                                                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                            </svg>
                                            Đổi mật khẩu
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div th:replace="~{fragments/layout :: toasts}"></div>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/profile.js}"></script>
<div th:replace="~{fragments/layout :: page-scripts}"></div>

<script>
// Tab switching
document.querySelectorAll('.profile-nav-item').forEach(function(btn) {
    btn.addEventListener('click', function() {
        const tabId = this.getAttribute('data-tab');
        document.querySelectorAll('.profile-nav-item').forEach(function(b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-pane').forEach(function(p) { p.classList.remove('active'); });
        this.classList.add('active');
        const target = document.getElementById(tabId);
        if (target) target.classList.add('active');
    });
});

// Deep link to password tab via URL hash
if (window.location.hash === '#password') {
    document.querySelector('[data-tab="passwordTab"]').click();
}
</script>
</body>
</html>
